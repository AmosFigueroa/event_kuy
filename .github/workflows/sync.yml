name: Sync ke Repo Lain

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Push ke Repository Tujuan
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source-directory: '.'
          destination-github-username: 'Hunion-dev'
          destination-repository-name: 'event_kuy'  # Perbaikan: Hapus 'Hunion-dev/'
          user-email: 'eventhmpbisdigupy@gmail.com'
          target-branch: main
